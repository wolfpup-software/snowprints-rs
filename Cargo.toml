[package]
name = "snowprints"
version = "0.2.1"
edition = "2024"

categories = ["data-structures", "network-programming"]
description = "Generate SQL-sortable shardable snowflake IDs"  
keywords = ["UUID", "snowflake", "distributed", "systems", "i64"]
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/w-lfpup/snowprints-rs"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
